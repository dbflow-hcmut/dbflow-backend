services:
  postgres:
    image: postgres:16
    container_name: dbflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - dbflow_postgres_data:/var/lib/postgresql/data

volumes:
  dbflow_postgres_data:
