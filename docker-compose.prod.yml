services:
  postgres:
    image: postgres:16
    container_name: dbflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbflow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dbflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command: ["sh", "-c", "redis-server --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0 --protected-mode no --notify-keyspace-events Ex"]
    restart: always

  backend:
    image: ${IMAGE}
    container_name: dbflow-backend
    restart: always
    env_file:
      - .env
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbflow}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - postgres
    logging:
      driver: awslogs
      options:
        awslogs-region: ${CLOUDWATCH_REGION:-us-east-1}
        awslogs-group: ${CLOUDWATCH_LOG_GROUP:-/dbflow/backend}
        awslogs-stream: ${CLOUDWATCH_LOG_STREAM:-production}
        awslogs-create-group: "true"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: dbflow-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: dbflow-node-exporter
    restart: always
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dbflow-grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  dbflow_postgres_data:
  redis-data:
  prometheus-data:
  grafana-data:
