services:
  postgres:
    image: postgres:16
    container_name: dbflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dbflow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dbflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command: ["sh", "-c", "redis-server --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0 --protected-mode no --notify-keyspace-events Ex"]
    restart: always

  backend:
    image: ${IMAGE}
    container_name: dbflow-backend
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dbflow}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - postgres

volumes:
  dbflow_postgres_data:
  redis-data:
